name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OrbitDock.sln

      - name: Build
        run: dotnet build OrbitDock.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests\OrbitDock.Tests\OrbitDock.Tests.csproj --configuration Release --no-build
