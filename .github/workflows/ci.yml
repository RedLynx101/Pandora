name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Pandora.sln

      - name: Build
        run: dotnet build Pandora.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests\Pandora.Tests\Pandora.Tests.csproj --configuration Release --no-build

      - name: Test visualizer lifecycle without media permissions
        run: node --test tools/SilkCurrentVisualizer/tests/visualizer.test.cjs

      - name: Test loopback-only visualizer server
        run: .\tools\SilkCurrentVisualizer\tests\server.test.ps1

      - name: Verify WPF controls in isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or -not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP must be an explicit absolute directory.'
          }
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'pandora-wpf-evidence'
          dotnet run --project tests\Pandora.App.Tests\Pandora.App.Tests.csproj --configuration Release --no-build -- --output $evidenceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated WPF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-wpf-evidence
          path: ${{ runner.temp }}/pandora-wpf-evidence
          if-no-files-found: warn
          retention-days: 7
